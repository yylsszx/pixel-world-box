name: Deploy to GitHub Pages

# 自动部署链：push 到 main → 安装依赖 → 静态导出 → 推 gh-pages → 探活
# 认证使用 Actions 内置 GITHUB_TOKEN（contents: write），无需任何用户凭证。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # --ignore-scripts：跳过 prisma 引擎下载等 postinstall（静态导出用不到，
      # 源码中亦无 @prisma/client 引用），加速并规避额外网络依赖。
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # export-static.sh：暂移 api 路由 → STATIC_EXPORT=1 构建 → 校验产物。
      # 注意：不能用 `bun run build`（那是沙箱部署链脚本，仓库内不存在）。
      - name: Static export (basePath=/pixel-world-box)
        run: bash .zscripts/export-static.sh /pixel-world-box

      - name: Push to gh-pages
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b gh-pages
          git add -A
          git -c user.name="deploy-bot" -c user.email="deploy@users.noreply.github.com" \
            commit -qm "CI static export $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Probe live site
        run: |
          URL="https://yylsszx.github.io/pixel-world-box/"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -m 10 -w "%{http_code}" "$URL" || echo 000)
            if [ "$code" = "200" ]; then echo "Site live: $URL"; exit 0; fi
            echo "[$i/12] HTTP $code — Pages 构建中，15s 后重试…"
            sleep 15
          done
          echo "::warning::站点 3 分钟内未返回 200，请到仓库 Settings → Pages 查看构建状态"
