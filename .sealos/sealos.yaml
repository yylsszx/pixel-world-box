# ============ Sealos 应用模板配置 ============
# 
# 部署步骤:
# 1. 在 Sealos 控制台创建 PostgreSQL 数据库
# 2. 复制 .sealos/env.example 为 .sealos/env.local 并填入实际值
# 3. 运行: sealos run -f .sealos/sealos.yaml --env-file .sealos/env.local
#
# 或使用部署脚本:
#   bash .sealos/deploy.sh

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixel-world-box
  labels:
    app: pixel-world-box
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixel-world-box
  template:
    metadata:
      labels:
        app: pixel-world-box
    spec:
      containers:
        - name: pixel-world-box
          image: ${image}
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pixel-world-secrets
                  key: database-url
            - name: Z_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pixel-world-secrets
                  key: z-api-key
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: pixel-world-secrets
                  key: nextauth-secret
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: SEALOS_BACKEND
              value: "1"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pixel-world-box
spec:
  selector:
    app: pixel-world-box
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pixel-world-box
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "pixel-world-box"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: ${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pixel-world-box
                port:
                  number: 80